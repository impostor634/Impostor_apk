name: Construir APK de El Impostor

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch: # Permite compilar manualmente cuando tú quieras con un clic

jobs:
  build-apk:
    name: Compilar y Generar APK
    runs-on: ubuntu-latest

    env:
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
      ANDROID_HOME: /usr/local/lib/android/sdk

    steps:
      - name: Descargar repositorio (Checkout)
        uses: actions/checkout@v4

      # Paso inteligente para resolver archivos duplicados (1), (2), zips o subcarpetas
      - name: Localizar y organizar el proyecto más reciente
        run: |
          python3 -c "
          import os, glob, re, shutil, zipfile

          print('=== Iniciando detección inteligente del proyecto ===')

          # 1. Si se subieron archivos .zip (ej: 'el-impostor-proyecto-apk (3).zip')
          zips = glob.glob('**/*.zip', recursive=True)
          if zips:
              def score_zip(z):
                  m = re.search(r'\((\d+)\)', os.path.basename(z))
                  return (int(m.group(1)) if m else 0, os.path.getmtime(z))
              latest_zip = max(zips, key=score_zip)
              print(f'-> Se detectaron zips: {zips}. Descomprimiendo el más reciente: {latest_zip}')
              with zipfile.ZipFile(latest_zip, 'r') as zf:
                  zf.extractall('.')

          # 2. Renombrar ficheros que tengan ' (1)', ' (2)' en su nombre
          for root, dirs, files in os.walk('.', topdown=False):
              for f in files:
                  m = re.match(r'^(.*?)\s*\(\d+\)(\.[^.]+)$', f)
                  if m:
                      clean_name = m.group(1) + m.group(2)
                      old_path = os.path.join(root, f)
                      new_path = os.path.join(root, clean_name)
                      if not os.path.exists(new_path) or os.path.getmtime(old_path) >= os.path.getmtime(new_path):
                          print(f'-> Corrigiendo nombre: {old_path} -> {new_path}')
                          shutil.copy2(old_path, new_path)

          # 3. Buscar todos los package.json en el repositorio
          pkgs = glob.glob('**/package.json', recursive=True)
          pkgs = [p for p in pkgs if 'node_modules' not in p]
          print(f'-> package.json encontrados: {pkgs}')

          if not pkgs:
              print('ERROR: No se encontró ningún package.json en el repositorio')
              exit(1)

          def score_pkg(p):
              folder = os.path.dirname(p)
              m = re.search(r'\((\d+)\)', folder)
              return (int(m.group(1)) if m else 0, os.path.getmtime(p))

          best_pkg = max(pkgs, key=score_pkg)
          best_dir = os.path.dirname(best_pkg)
          print(f'-> Directorio de proyecto más reciente seleccionado: \"{best_dir}\"')

          if best_dir and best_dir != '.':
              print(f'-> Moviendo todo el contenido de {best_dir} a la raíz del repositorio...')
              for item in os.listdir(best_dir):
                  src = os.path.join(best_dir, item)
                  dst = os.path.join('.', item)
                  if os.path.isdir(src):
                      if os.path.exists(dst):
                          shutil.rmtree(dst)
                      shutil.copytree(src, dst)
                  else:
                      shutil.copy2(src, dst)

          # 4. Asegurar capacitor.config.json en la raíz
          if not os.path.exists('capacitor.config.json'):
              cap_configs = glob.glob('**/capacitor.config*.json', recursive=True)
              cap_configs = [c for c in cap_configs if 'android' not in c and 'node_modules' not in c]
              if cap_configs:
                  shutil.copy2(cap_configs[0], 'capacitor.config.json')
                  print(f'-> capacitor.config.json copiado desde {cap_configs[0]}')
              else:
                  print('-> Creando capacitor.config.json predeterminado...')
                  with open('capacitor.config.json', 'w') as f:
                      f.write('{\n  "appId": "com.kendry.elimpostor",\n  "appName": "El Impostor",\n  "webDir": "dist",\n  "server": {\n    "androidScheme": "https"\n  }\n}\n')

          print('=== Proyecto organizado en la raíz con éxito ===')
          "

      # Configurar Node.js (Ubuntu ya cuenta con Node, continue-on-error evita fallos de red)
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
        continue-on-error: true

      - name: Configurar JDK 17 (Java)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Instalar dependencias del proyecto
        run: |
          echo "Node version: $(node -v)"
          echo "NPM version: $(npm -v)"
          npm install --legacy-peer-deps --force --no-audit --no-fund

      - name: Compilar aplicación web
        run: npm run build

      - name: Sincronizar o crear proyecto Android
        run: |
          echo "Verificando estado del proyecto nativo Android..."
          
          # Si la carpeta android existe pero está incompleta (falta gradlew o build.gradle), eliminarla
          if [ -d "android" ]; then
            if [ ! -f "android/gradlew" ] || [ ! -f "android/app/build.gradle" ]; then
              echo "Detectada carpeta android incompleta. Eliminando para recrear limpia..."
              rm -rf android
            fi
          fi

          # Si no existe la carpeta android, crearla limpia con Capacitor
          if [ ! -d "android" ]; then
            echo "Creando estructura Android nativa con Capacitor..."
            npx cap add android
          else
            echo "Sincronizando cambios de la aplicación web con Android..."
            npx cap sync android || {
              echo "Error al sincronizar. Recreando proyecto Android desde cero..."
              rm -rf android
              npx cap add android
            }
          fi

          echo "Asegurando copia de recursos web a la app Android..."
          npx cap copy android

      - name: Asignar permisos a Gradle
        run: chmod +x ./android/gradlew

      - name: Compilar APK Android (Debug)
        run: |
          cd android
          ./gradlew assembleDebug --no-daemon --stacktrace

      - name: Subir APK como Artefacto descargable
        uses: actions/upload-artifact@v4
        with:
          name: El-Impostor-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 14
